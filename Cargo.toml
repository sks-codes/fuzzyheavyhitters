[dev-dependencies]
rayon = "1.3.1"
[package]
name = "mosaic"
version = "0.1.0"
edition = "2018"

[dependencies]
lazy_static = "1.4"
num-bigint = { version = "0.4.6", features = ["rand", "serde"] }
rand = "0.9.1"
rand_core = "0.9.3"
rand_distr = "0.5.1"
clap = "4.5.51"
futures = { version = "0.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tarpc = { version = "0.30.0", features = ["full", "serde-transport", "tcp", "tokio1"]  }
tokio = { version = "=1.28.2", features = ["full", "macros"] }
env_logger = "0.6"
aes = "0.8.4"
ctr = "0.9.2"
aesni = "0.7.0"
num = "0.2.1"
rayon = "1.3.1"
primal = "0.2.3"
zipf = "6.1.0"
bincode = "1.3"
csv = "1.2"
crossbeam = "0.8"
fancy-garbling = { git = "https://github.com/GaloisInc/swanky", rev="553ede0"}
ocelot = { git = "https://github.com/GaloisInc/swanky", rev="553ede0"}
scuttlebutt = { git = "https://github.com/GaloisInc/swanky", rev="553ede0"}
num_cpus = "1.16.0"
memmap2 = "0.9.5"
blake3 = "1.8.2"
indicatif = "0.18.0"
chrono = "0.4"
chrono-tz = "0.8"


